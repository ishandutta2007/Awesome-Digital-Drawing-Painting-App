<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="brushGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="brushGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    
    /* Dynamic Wave Animations */
    @keyframes waveMove1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-30px, 15px) scale(1.02); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes waveMove2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(25px, -18px) scale(0.98); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(40px, -25px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(-35px, 30px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes pulseStroke {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 600; }
    }

    .dynamic-bg-1 {
      animation: waveMove1 12s ease-in-out infinite;
    }
    .dynamic-bg-2 {
      animation: waveMove2 10s ease-in-out infinite;
    }
    .floating-orb-1 {
      animation: floatOrb1 9s ease-in-out infinite;
    }
    .floating-orb-2 {
      animation: floatOrb2 11s ease-in-out infinite;
    }
    .animated-brush {
      stroke-dasharray: 20 15;
      animation: pulseStroke 25s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs in Background -->
  <g class="floating-orb-1">
    <circle cx="200" cy="120" r="160" fill="url(#brushGlow1)" />
  </g>
  <g class="floating-orb-2">
    <circle cx="1020" cy="280" r="180" fill="url(#brushGlow2)" />
  </g>

  <!-- Dynamic Fluid / Creative Wave Curves (Behind Foreground Cards & Text) -->
  <g opacity="0.45" class="dynamic-bg-1">
    <path d="M-50,300 C200,220 350,380 600,290 C850,200 950,350 1250,240 L1250,450 L-50,450 Z" fill="url(#accentGlow)" />
  </g>
  <g opacity="0.3" class="dynamic-bg-2">
    <path d="M-50,340 C150,390 400,240 700,320 C1000,400 1100,260 1250,310 L1250,450 L-50,450 Z" fill="url(#primaryGrad)" />
  </g>

  <!-- Animated Drawing Brush Stroke Spline -->
  <path class="animated-brush" d="M 60 70 Q 300 20 550 80 T 1140 60" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.6" />
  <path class="animated-brush" d="M 80 370 Q 400 410 750 350 T 1120 380" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

  <!-- Grid overlay for digital canvas vibe -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- FOREGROUND LAYER: Completely Unobstructed Content Card -->
  <g filter="url(#shadow)">
    <!-- High-contrast backdrop panel keeping text perfectly readable -->
    <rect x="70" y="55" width="1060" height="310" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
  </g>

  <!-- Header Badge / Top Tagline -->
  <g transform="translate(105, 85)">
    <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#10b981" />
    <text x="32" y="19" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#cbd5e1">CURATED CREATIVE TOOLS</text>
  </g>

  <!-- Main Title with Gradient Brush Icon -->
  <g transform="translate(105, 160)">
    <!-- Palette / Brush SVG Icon -->
    <g transform="translate(0, -36)">
      <rect width="44" height="44" rx="10" fill="url(#primaryGrad)" />
      <path d="M 14 30 C 14 30 18 28 20 25 C 22 22 24 16 30 14 C 30 14 26 22 23 25 C 21 27 18 30 14 30 Z" fill="#ffffff" />
      <circle cx="31" cy="13" r="2.5" fill="#fef08a" />
    </g>
    <text x="58" y="0" class="title-text">Awesome Digital Drawing &amp; Painting</text>
  </g>

  <!-- Subtitle Text -->
  <text x="105" y="200" class="subtitle-text">
    A curated index of top-tier SaaS platforms, professional suites &amp; open-source drawing apps
  </text>

  <!-- Feature Tags / Category Pills in Foreground -->
  <g transform="translate(105, 235)">
    <!-- Pill 1: Digital Painting -->
    <g transform="translate(0, 0)">
      <rect width="145" height="34" rx="17" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
      <text x="72.5" y="22" text-anchor="middle" class="pill-text">🎨 Digital Painting</text>
    </g>
    <!-- Pill 2: Concept Art -->
    <g transform="translate(155, 0)">
      <rect width="135" height="34" rx="17" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="67.5" y="22" text-anchor="middle" class="pill-text">✨ Concept Art</text>
    </g>
    <!-- Pill 3: Illustration & Manga -->
    <g transform="translate(300, 0)">
      <rect width="170" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <text x="85" y="22" text-anchor="middle" class="pill-text">🖌️ Vector &amp; Raster</text>
    </g>
    <!-- Pill 4: Open-Source First -->
    <g transform="translate(480, 0)">
      <rect width="175" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="87.5" y="22" text-anchor="middle" class="pill-text">🔓 Open-Source Stars</text>
    </g>
    <!-- Pill 5: Cross-Platform -->
    <g transform="translate(665, 0)">
      <rect width="155" height="34" rx="17" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="77.5" y="22" text-anchor="middle" class="pill-text">💻 Multi-Platform</text>
    </g>
  </g>

  <!-- Bottom Metric / Tagline bar inside Card -->
  <g transform="translate(105, 310)">
    <line x1="0" y1="0" x2="990" y2="0" stroke="#334155" stroke-width="1" />
    <text x="0" y="26" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#64748b">
      Updated for 2026 • Verified Free Tiers &amp; Pricing • Ranked by Stargazers &amp; Company Scale
    </text>
    <text x="990" y="26" text-anchor="end" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#38bdf8">
      100% Free &amp; Open Ecosystem
    </text>
  </g>
</svg>
